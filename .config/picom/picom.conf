# General
experimental-backends = true;
backend = "glx";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-damage = false;
log-level = "info";

# Shadows
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.5;
shadow-offset-x = -4;
shadow-offset-y = -5;

shadow-exclude = [
  #"name = 'Notification'",
  #"_GTK_FRAME_EXTENTS@:c",
  "!focused",
  #"class_g='i3lock'",
  #"class_g='polybar'",
];

# Fading
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

# Opacity
#inactive-opacity = 0.8;
#frame-opacity = 0.7;
#inactive-opacity-override = false;
#active-opacity = 1;

# Blurring
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 5;
blur-kern = "3x3box";
