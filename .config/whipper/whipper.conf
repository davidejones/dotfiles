[main]
# Replaces characters illegal on Windows/FAT filesystems (\ / : * ? " < > |)
path_filter_vfat = True

# Replaces characters problematic in POSIX/Linux shells (like ;)
path_filter_posix = True

# Replaces non-printable characters
path_filter_printable = True

# Optional: Replaces whitespace with underscores (set to False to keep spaces)
path_filter_whitespace = False

[whipper.cd.rip]
# Set where the music goes
output_directory = ~/Music

# Set how folders and files are named
# This example: Artist/Year - Album/Track - Title
track_template = %%A/%%y - %%d/%%t - %%n

# Matches the folder structure above
disc_template = %%A/%%y - %%d/%%A - %%d

# Include a .m3u playlist file
playlist_template = %%A/%%y - %%d/%%A - %%d.m3u

# Always use MusicBrainz ID (prevents manual prompts)
unknown = True

# Fetch cover art
embed = True

